<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norsecraft Trailer</title>
<meta name="description" content="A one-minute motion graphic of Norsecraft, drawn with the game's own art.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* One cinematic dark look, taken from the game: night sky, gold leaf, snow. */
  :root {
    color-scheme: dark;
    --bg: #070b10;
    --panel: #121820;
    --edge: #6b5636;
    --gold: #f1d38a;
    --text: #e9e1cf;
    --muted: #a99f8a;
    --ice: #9fe8ff;
    --display: 'Cinzel', Georgia, serif;
    --body: 'Alegreya Sans', system-ui, sans-serif;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
  .wrap {
    max-width: 1120px; margin: 0 auto;
    padding-block: 20px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); color: var(--gold); letter-spacing: 2px; text-wrap: balance; }
  .eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  canvas { display: block; width: 100%; height: 100%; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls button {
    font-family: var(--body); font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 7px 14px;
  }
  .controls button:hover { border-color: var(--gold); }
  .controls button:focus-visible, .mark:focus-visible, a:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  #scrub { position: relative; flex: 1; min-width: 160px; height: 10px; background: var(--panel); border: 1px solid #3a3226; border-radius: 5px; cursor: pointer; }
  #scrub-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #8a6a3a, var(--gold)); border-radius: 5px; }
  #scrub-marks { position: absolute; inset: 0; }
  .mark { position: absolute; top: -4px; width: 4px; height: 16px; margin-left: -2px; padding: 0; background: #3a3226; border: 0; border-radius: 2px; cursor: pointer; }
  .mark:hover { background: var(--gold); }
  .note { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 65ch; }
  .note a { color: var(--ice); }
  body.record .wrap { padding: 0; max-width: none; }
  body.record header, body.record .controls, body.record .note { display: none; }
  body.record .stage { border: 0; border-radius: 0; box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { .controls button { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Norsecraft</h1>
    <span class="eyebrow">Trailer · about 1 minute</span>
  </header>
  <div class="stage"><canvas id="stage" width="1280" height="720" aria-label="Animated trailer for Norsecraft"></canvas></div>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <button id="sound" type="button" aria-pressed="false">Sound off</button>
    <div id="scrub" role="slider" aria-label="Trailer position"><div id="scrub-fill"></div><div id="scrub-marks"></div></div>
  </div>
  <p class="note">Every unit, building and spell in this trailer is drawn live by the game's own code. Turn on sound for the drums and thunder. <a href="index.html">Play Norsecraft</a>.</p>
</div>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/render.js"></script>
<script src="js/trailer.js"></script>
</body>
</html>
